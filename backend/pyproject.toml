[project]
name = "mechanified-backend"
version = "0.1.0"
description = "API REST de Mechanified — gestión de talleres mecánicos"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
    # Acentos y signos del español en identificadores, cadenas y comentarios.
    "RUF001", "RUF002", "RUF003",
    # B008: llamar a Depends()/Header() en los argumentos por defecto es
    # precisamente cómo se declaran las dependencias en FastAPI.
    "B008",
    # N818: exige el sufijo "Error" en las excepciones. Nuestro dominio está en
    # español y usa el prefijo (ErrorPermiso, ErrorNoEncontrado).
    "N818",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Un solo bucle de eventos para toda la sesión de pruebas. El motor de
# SQLAlchemy es un singleton con pool de conexiones atadas al bucle que las
# creó; con un bucle por prueba, la segunda encuentra conexiones muertas.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "integration: requiere Supabase local levantado (supabase start)",
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true
