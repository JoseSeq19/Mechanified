name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend · lint y pruebas unitarias
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest tests/unit -v

  web:
    name: Web · tipos y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  base_datos:
    name: Base de datos · migraciones y RLS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - name: Verificar que las migraciones aplican en limpio
        run: supabase db reset
      - name: Verificar que no falta RLS en ninguna tabla de negocio
        run: |
          supabase db diff --schema public || true
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -c "
            do \$\$
            declare faltantes text;
            begin
              select string_agg(c.relname, ', ')
                into faltantes
                from pg_class c
                join pg_namespace n on n.oid = c.relnamespace
               where n.nspname = 'public'
                 and c.relkind = 'r'
                 and not c.relrowsecurity;
              if faltantes is not null then
                raise exception 'Tablas sin RLS habilitado: %', faltantes;
              end if;
            end \$\$;"
