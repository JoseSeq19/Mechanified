# Configuración del entorno local de Supabase para Mechanified.
# El project_id se queda en "meseta": es el que nombra los contenedores y el
# volumen de Docker, y cambiarlo deja el entorno local vacío otra vez.
project_id = "meseta"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

# Captura de correos salientes en desarrollo (no sale nada a internet).
[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "25MiB"

[auth]
enabled = true
# El sitio (npm run dev:sitio). Es a donde vuelven los correos de Auth.
site_url = "http://localhost:5174"
# Con comodín para que valga cualquier ruta, no solo la raíz. Las que importan
# son /clave, donde aterriza el correo de recuperación de contraseña, y
# /cuenta, a donde vuelve el de confirmación del registro (ver RUTA_CLAVE_NUEVA
# y RUTA_CUENTA en web/src/app/sesion.tsx): si no estuvieran autorizadas, Auth
# mandaría a la persona a site_url y el enlace no serviría.
additional_redirect_urls = [
  "http://localhost:5174",
  "http://localhost:5174/**",
  "http://localhost:5173",
  "http://localhost:5173/**",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true

# OJO, comprobado a las malas: poner esto en false NO deja solo "sin registro",
# apaga el proveedor de correo entero y nadie puede iniciar sesión, ni siquiera
# los usuarios que el administrador ya creó ("Email logins are disabled").
#
# Y el registro tiene que estar abierto: quien funda una organización crea su
# cuenta en el sitio. En el proyecto hospedado es el interruptor
# Authentication > Sign In / Providers > Email > "Allow new users to sign up".
# Una cuenta recién creada no tiene perfil, y sin perfil RLS no le deja ver
# ningún dato de taller.
enable_signup = true

[auth.email]
# No existe una llave `enabled` en esta sección: el CLI rechaza el archivo
# entero con "'auth.email' has invalid keys: enabled".
enable_signup = true
enable_confirmations = false
double_confirm_changes = true

# Inyecta taller_id y rol como claims del access token.
# Sin este hook las políticas RLS no pueden resolver el tenant y
# todo queda denegado por defecto (falla cerrada, que es lo correcto).
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/mch_hook_access_token"
